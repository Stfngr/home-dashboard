<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home Dashboard</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header><p class="eyebrow">ZU HAUSE</p><h1>Home Dashboard</h1>
    <p id="status" role="status">Verbindung wird hergestellt …</p></header>
  <main>
    <section id="empty" class="card"><h2>Noch kein Rezept ausgewählt.</h2>
      <p>Sobald du im Telegram-Bot ein Rezept auswählst, erscheint es hier.</p></section>
    <article id="recipe" class="card" hidden>
      <img id="photo" alt="" referrerpolicy="no-referrer" hidden>
      <div class="content"><p class="eyebrow">ZULETZT AUSGEWÄHLT</p>
        <h2 id="title"></h2><p id="selection"></p><p id="facts" class="facts"></p>
        <div class="columns"><section><h3>Zutaten</h3><ul id="ingredients"></ul></section>
          <section><h3>Zubereitung</h3><ol id="instructions"></ol></section></div>
        <footer><p id="credits"></p><a id="source" target="_blank" rel="noopener noreferrer" hidden>Originalrezept öffnen ↗</a></footer>
      </div>
    </article>
  </main>
  <footer class="page-footer">Automatische Aktualisierung alle 15 Sekunden.</footer>
</body>
</html>
